<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🎬 iPTV Player - All Channels</title>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.15.4/dist/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a3e;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e63946, #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stats {
            display: flex;
            gap: 12px;
            font-size: 0.7rem;
            background: #1e1e2e;
            padding: 5px 12px;
            border-radius: 20px;
        }

        /* Search Bar */
        .search-section {
            padding: 12px 16px;
            background: #0f0f1a;
            border-bottom: 1px solid #1a1a2e;
            flex-shrink: 0;
        }

        .search-box {
            width: 100%;
            padding: 10px 16px;
            background: #1e1e2e;
            border: 1px solid #2a2a3e;
            border-radius: 30px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-box:focus {
            border-color: #e63946;
            background: #252535;
        }

        /* Category Filter */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            background: #0f0f1a;
            border-bottom: 1px solid #1a1a2e;
            flex-shrink: 0;
        }

        .category-btn {
            background: #1e1e2e;
            border: none;
            color: #aaa;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .category-btn.active {
            background: #e63946;
            color: white;
        }

        /* Channel Grid */
        .channels-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }

        .channel-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .channel-card:hover {
            background: #2a2a3e;
            transform: translateY(-3px);
        }

        .channel-card.active {
            border-color: #e63946;
            background: #2a1a2e;
        }

        .channel-logo {
            width: 50px;
            height: 50px;
            margin: 0 auto 8px;
            background: #252535;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .channel-name {
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-category {
            font-size: 0.55rem;
            color: #888;
            margin-top: 4px;
        }

        /* Player Panel */
        .player-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-top: 1px solid #333;
        }

        .player-panel.open {
            transform: translateY(0);
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #1a1a2e;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-logo {
            width: 36px;
            height: 36px;
            background: #252535;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .player-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .close-player {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-player:hover {
            background: #e63946;
        }

        video {
            width: 100%;
            height: auto;
            max-height: 40vh;
            background: #000;
        }

        .error-badge {
            padding: 12px 16px;
            text-align: center;
            color: #e63946;
            background: #1a1a2e;
            font-size: 0.75rem;
            display: none;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            flex-direction: column;
            gap: 12px;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #e63946;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📺 iPTV Player</h1>
    <div class="stats">
        <span id="channelCount">0</span>
        <span>channels</span>
    </div>
</div>

<div class="search-section">
    <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search channel...">
</div>

<div class="categories" id="categoriesContainer"></div>

<div class="channels-area">
    <div class="channel-grid" id="channelGrid"></div>
</div>

<div class="player-panel" id="playerPanel">
    <div class="player-header">
        <div class="player-info">
            <div class="player-logo" id="playerLogoIcon">📺</div>
            <div class="player-title" id="playerTitle">Select a channel</div>
        </div>
        <button class="close-player" id="closePlayerBtn">✕</button>
    </div>
    <video id="videoElement" controls playsinline></video>
    <div class="error-badge" id="errorBadge"></div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div>Loading stream...</div>
</div>

<script>
// ============================================
// FETCH CHANNELS FROM YOUR GITHUB JSON
// ============================================
let allChannels = [];
let currentPlayer = null;
let currentHls = null;
let currentChannel = null;
let activeCategory = 'All';
let searchTerm = '';

// DOM elements
const channelGrid = document.getElementById('channelGrid');
const searchInput = document.getElementById('searchInput');
const categoriesContainer = document.getElementById('categoriesContainer');
const playerPanel = document.getElementById('playerPanel');
const videoElement = document.getElementById('videoElement');
const playerTitle = document.getElementById('playerTitle');
const playerLogoIcon = document.getElementById('playerLogoIcon');
const closePlayerBtn = document.getElementById('closePlayerBtn');
const errorBadge = document.getElementById('errorBadge');
const loadingOverlay = document.getElementById('loadingOverlay');
const channelCountSpan = document.getElementById('channelCount');

// ============================================
// FETCH DATA FROM GITHUB
// ============================================
async function fetchChannels() {
    showLoading(true);
    try {
        const response = await fetch('https://raw.githubusercontent.com/Joker7263/Nba-live/refs/heads/main/all%20channel.json');
        const data = await response.json();
        allChannels = data.channels || [];
        console.log(`✅ Loaded ${allChannels.length} channels`);
        renderCategories();
        renderChannels();
    } catch (error) {
        console.error('Failed to load channels:', error);
        channelGrid.innerHTML = '<div class="no-results">❌ Failed to load channels. Check your internet.</div>';
    } finally {
        showLoading(false);
    }
}

// ============================================
// GET UNIQUE CATEGORIES
// ============================================
function getCategories() {
    const cats = new Set(['All']);
    allChannels.forEach(ch => {
        if (ch.category) cats.add(ch.category);
    });
    return Array.from(cats);
}

// ============================================
// FILTER CHANNELS
// ============================================
function getFilteredChannels() {
    return allChannels.filter(ch => {
        const matchCategory = activeCategory === 'All' || ch.category === activeCategory;
        const matchSearch = !searchTerm || ch.name.toLowerCase().includes(searchTerm.toLowerCase());
        return matchCategory && matchSearch;
    });
}

// ============================================
// RENDER CATEGORY BUTTONS
// ============================================
function renderCategories() {
    const categories = getCategories();
    categoriesContainer.innerHTML = categories.map(cat => `
        <button class="category-btn ${cat === activeCategory ? 'active' : ''}" data-category="${cat}">
            ${cat}
        </button>
    `).join('');
    
    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            activeCategory = btn.dataset.category;
            renderCategories();
            renderChannels();
        });
    });
}

// ============================================
// RENDER CHANNEL GRID
// ============================================
function renderChannels() {
    const filtered = getFilteredChannels();
    channelCountSpan.textContent = filtered.length;
    
    if (filtered.length === 0) {
        channelGrid.innerHTML = '<div class="no-results">📭 No channels found</div>';
        return;
    }
    
    channelGrid.innerHTML = filtered.map((ch, idx) => `
        <div class="channel-card" data-index="${idx}" data-name="${escapeHtml(ch.name)}">
            <div class="channel-logo">${getChannelIcon(ch.name)}</div>
            <div class="channel-name">${escapeHtml(ch.name)}</div>
            <div class="channel-category">${ch.category || 'Uncategorized'}</div>
        </div>
    `).join('');
    
    // Add click handlers
    document.querySelectorAll('.channel-card').forEach(card => {
        card.addEventListener('click', () => {
            const name = card.dataset.name;
            const channel = allChannels.find(c => c.name === name);
            if (channel) playChannel(channel);
        });
    });
}

// Helper: simple icon based on channel name
function getChannelIcon(name) {
    const lower = name.toLowerCase();
    if (lower.includes('movie')) return '🎬';
    if (lower.includes('news')) return '📰';
    if (lower.includes('sports')) return '⚽';
    if (lower.includes('kids')) return '🧸';
    if (lower.includes('music')) return '🎵';
    if (lower.includes('anime')) return '🇯🇵';
    if (lower.includes('documentary')) return '🌍';
    return '📺';
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// ============================================
// PLAY CHANNEL (Handles DRM, HLS, YouTube)
// ============================================
async function playChannel(channel) {
    // Clean up previous player
    cleanupPlayer();
    
    currentChannel = channel;
    playerTitle.textContent = channel.name;
    playerLogoIcon.textContent = getChannelIcon(channel.name);
    errorBadge.style.display = 'none';
    errorBadge.textContent = '';
    playerPanel.classList.add('open');
    
    const url = channel.streamUrl;
    const isMpd = url && (url.includes('.mpd') || url.includes('manifest.mpd'));
    const isM3u8 = url && (url.includes('.m3u8') || url.includes('playlist.m3u8'));
    const isYouTube = channel.type === 'youtube' || channel.type === 'youtube-channel';
    
    showLoading(true);
    
    try {
        if (isMpd) {
            await playMpdStream(channel);
        } else if (isM3u8) {
            await playHlsStream(channel);
        } else if (isYouTube) {
            showLoading(false);
            errorBadge.textContent = `🔗 YouTube: Open in new tab? ${channel.streamUrl}`;
            errorBadge.style.display = 'block';
            errorBadge.style.cursor = 'pointer';
            errorBadge.onclick = () => {
                window.open(`https://www.youtube.com/${channel.streamUrl}`, '_blank');
            };
        } else {
            throw new Error('Unknown stream format');
        }
    } catch (err) {
        showLoading(false);
        errorBadge.textContent = `❌ ${err.message}`;
        errorBadge.style.display = 'block';
        console.error('Playback error:', err);
    }
}

// ============================================
// PLAY DASH/MPD WITH DRM (Widevine ClearKey)
// ============================================
async function playMpdStream(channel) {
    if (!shaka.Player.isBrowserSupported()) {
        throw new Error('Your browser does not support DRM playback');
    }
    
    const player = new shaka.Player(videoElement);
    currentPlayer = player;
    
    // Configure DRM if present
    if (channel.drm && Object.keys(channel.drm).length > 0) {
        const clearKeys = {};
        for (const [kid, key] of Object.entries(channel.drm)) {
            clearKeys[kid] = key;
        }
        player.configure({ drm: { clearKeys: clearKeys } });
    }
    
    // Add custom headers if present
    if (channel.headers) {
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            for (const [key, value] of Object.entries(channel.headers)) {
                if (key === 'User-Agent' && typeof value === 'string' && value.includes('&Referer')) {
                    const parts = value.split('&');
                    for (const part of parts) {
                        if (part.startsWith('Referer=')) {
                            request.headers['Referer'] = part.replace('Referer=', '');
                        } else if (part.startsWith('Origin=')) {
                            request.headers['Origin'] = part.replace('Origin=', '');
                        } else {
                            request.headers['User-Agent'] = part;
                        }
                    }
                } else {
                    request.headers[key] = value;
                }
            }
        });
    }
    
    // Error handling
    player.addEventListener('error', (event) => {
        const err = event.detail;
        console.error('Shaka error:', err);
        showLoading(false);
        errorBadge.textContent = `DRM Error: ${err.message || 'Failed to decrypt'}`;
        errorBadge.style.display = 'block';
    });
    
    await player.load(channel.streamUrl);
    showLoading(false);
    await videoElement.play().catch(e => console.log('Autoplay prevented:', e));
}

// ============================================
// PLAY HLS/M3U8 STREAM
// ============================================
function playHlsStream(channel) {
    return new Promise((resolve, reject) => {
        if (Hls.isSupported()) {
            const hls = new Hls({
                maxBufferLength: 30,
                maxMaxBufferLength: 60
            });
            currentHls = hls;
            hls.attachMedia(videoElement);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                showLoading(false);
                videoElement.play().catch(e => console.log('Autoplay blocked:', e));
                resolve();
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    reject(new Error(`HLS error: ${data.type}`));
                }
            });
            hls.loadSource(channel.streamUrl);
        } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
            videoElement.src = channel.streamUrl;
            videoElement.addEventListener('loadedmetadata', () => {
                showLoading(false);
                videoElement.play().catch(e => console.log('Autoplay blocked:', e));
                resolve();
            });
            videoElement.addEventListener('error', (e) => reject(new Error('Video playback error')));
        } else {
            reject(new Error('HLS not supported'));
        }
    });
}

// ============================================
// CLEANUP PLAYER RESOURCES
// ============================================
function cleanupPlayer() {
    if (currentHls) {
        currentHls.destroy();
        currentHls = null;
    }
    if (currentPlayer) {
        try {
            currentPlayer.destroy();
        } catch(e) {}
        currentPlayer = null;
    }
    videoElement.pause();
    videoElement.src = '';
    videoElement.load();
}

// ============================================
// UI HELPERS
// ============================================
function showLoading(show) {
    if (show) {
        loadingOverlay.classList.add('show');
    } else {
        loadingOverlay.classList.remove('show');
    }
}

// Close player panel
closePlayerBtn.addEventListener('click', () => {
    playerPanel.classList.remove('open');
    cleanupPlayer();
});

// Search functionality
searchInput.addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderChannels();
});

// ============================================
// INITIALIZE
// ============================================
fetchChannels();
</script>
</body>
</html>
