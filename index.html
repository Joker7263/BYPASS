<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PH IPTV · DASH + HLS + DRM Ready</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.14.28/controls.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    :root {
      --accent: #ffb347;
      --accent-glow: rgba(255, 180, 71, 0.5);
      --bg: #0b0e16;
      --card-bg: #181e2a;
      --glass: rgba(255, 255, 255, 0.05);
      --text-dim: #cbd5e6;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: white;
      overflow: hidden;
      height: 100vh;
    }
    #video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #000000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #fallback-audio {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      border-radius: 40px;
      padding: 6px 20px;
      font-size: 0.8rem;
      font-weight: 500;
      display: none;
      z-index: 12;
      border-left: 3px solid var(--accent);
      pointer-events: none;
    }
    #ui-layer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: radial-gradient(circle at 20% 20%, rgba(10,14,20,0.94) 0%, rgba(8,12,18,0.98) 100%);
      backdrop-filter: blur(8px);
      transition: opacity 0.25s ease, visibility 0.2s;
      padding: 20px 26px;
    }
    #ui-layer.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .badge {
      background: var(--glass);
      padding: 6px 18px;
      border-radius: 60px;
      font-size: 0.8rem;
      font-weight: 500;
      backdrop-filter: blur(4px);
      letter-spacing: 0.3px;
    }
    #clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
    }
    #search-row {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    #search-input {
      width: 70%;
      max-width: 520px;
      background: rgba(25, 30, 42, 0.9);
      border: 1.5px solid #2f3a4b;
      border-radius: 60px;
      padding: 12px 24px;
      color: white;
      font-size: 1rem;
      outline: none;
      text-align: center;
      transition: all 0.2s;
    }
    #search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      background: #1e2535;
    }
    #channel-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
      overflow-y: auto;
      padding: 6px 5px 30px 5px;
      align-content: start;
    }
    #channel-grid::-webkit-scrollbar {
      width: 6px;
    }
    #channel-grid::-webkit-scrollbar-track {
      background: #141a24;
      border-radius: 10px;
    }
    #channel-grid::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 10px;
    }
    .channel-card {
      background: var(--card-bg);
      padding: 18px 8px;
      border-radius: 28px;
      text-align: center;
      cursor: pointer;
      border: 1px solid rgba(255,255,240,0.05);
      transition: transform 0.2s cubic-bezier(0.2,0.9,0.4,1.1), background 0.2s, border-color 0.2s;
    }
    .channel-card.filtered-out {
      display: none;
    }
    .channel-card:hover {
      background: #252e40;
      transform: translateY(-4px);
      border-color: rgba(255,180,71,0.5);
    }
    .channel-card:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
      background: #2a3347;
    }
    .logo-circle {
      width: 80px;
      height: 80px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(12, 16, 24, 0.7);
      border-radius: 50%;
      font-weight: bold;
      font-size: 2rem;
    }
    .letter-fallback {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(145deg, #ffc371, var(--accent));
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .channel-card span {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 6px;
      color: #f0f3fa;
    }
    .donate-card {
      background: linear-gradient(145deg, #262d3d, #1c212f);
      border: 1px solid rgba(255,200,110,0.4);
    }
    #loader-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      display: none;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      padding: 18px 30px;
      border-radius: 60px;
      gap: 14px;
      align-items: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #2f3748;
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .toast-error {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #e03a3e;
      color: white;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 300;
      display: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }
    .footer-hint {
      font-size: 0.7rem;
      text-align: center;
      margin-top: 10px;
      color: #8592aa;
    }
    @media (max-width: 640px) {
      #ui-layer { padding: 16px 16px; }
      #channel-grid { gap: 14px; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); }
      .logo-circle { width: 65px; height: 65px; }
      .toast-error { white-space: normal; text-align: center; }
    }
  </style>
</head>
<body>
<div id="loader-overlay"><div class="spinner"></div><span style="margin-left:12px;">Buffering stream...</span></div>
<div class="toast-error" id="errorToast">⚠️ Stream error</div>
<div id="video-container" data-shaka-player-container>
  <video id="video" autoplay playsinline></video>
  <div id="fallback-audio">🎧 Audio-only stream</div>
</div>
<div id="ui-layer">
  <div class="status-bar">
    <span class="badge">🇵🇭 PH · DASH+HLS · DRM</span>
    <span class="badge" id="clock">--:--</span>
  </div>
  <div id="search-row">
    <input type="text" id="search-input" placeholder="🔍 Search channels (GMA, News, Movies, etc)" autocomplete="off">
  </div>
  <div id="channel-grid"></div>
  <div class="footer-hint">⚡ Click any channel • Fullscreen available • ESC to show UI</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.14.28/shaka-player.ui.min.js"></script>
<script>
  (function(){
    // ----- GLOBALS -----
    let player = null;
    let ui = null;
    let allChannels = [];
    let lastFocusedCard = null;
    
    // DOM elements
    const videoEl = document.getElementById('video');
    const container = document.getElementById('video-container');
    const uiLayer = document.getElementById('ui-layer');
    const loaderDiv = document.getElementById('loader-overlay');
    const searchBox = document.getElementById('search-input');
    const grid = document.getElementById('channel-grid');
    const audioBadge = document.getElementById('fallback-audio');
    const errorToast = document.getElementById('errorToast');
    const channelBadge = document.querySelector('.status-bar .badge:first-child');
    
    // Helper: toast
    function showToast(msg, isError = true) {
      errorToast.textContent = msg || (isError ? 'Playback failed' : 'Notice');
      errorToast.style.display = 'block';
      setTimeout(() => { errorToast.style.display = 'none'; }, 3300);
    }
    
    // UI toggle (fullscreen + focus)
    function toggleUI(show) {
      if (show) {
        if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
        uiLayer.classList.remove('hidden');
        setTimeout(() => {
          if (lastFocusedCard && document.body.contains(lastFocusedCard)) {
            lastFocusedCard.focus();
          } else if (searchBox) {
            searchBox.focus();
          }
        }, 60);
        window.history.pushState({ ui: 'visible' }, '');
      } else {
        uiLayer.classList.add('hidden');
      }
    }
    window.onpopstate = () => {
      if (uiLayer.classList.contains('hidden')) toggleUI(true);
    };
    
    // ----- SHAKA INIT (HLS + DASH + DRM ready) -----
    async function initShakaPlayer() {
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) {
        showToast('Browser not supported for DASH/HLS playback');
        return false;
      }
      player = new shaka.Player(videoEl);
      ui = new shaka.ui.Overlay(player, container, videoEl);
      ui.configure({
        controlPanelElements: ['play_pause', 'time_and_duration', 'spacer', 'quality', 'fullscreen'],
        overflowMenuButtons: ['quality']
      });
      
      // Detect audio-only and show badge
      player.addEventListener('loaded', () => {
        const isAudioOnly = player.isAudioOnly();
        audioBadge.style.display = isAudioOnly ? 'flex' : 'none';
      });
      
      player.addEventListener('error', (event) => {
        console.warn('Shaka error', event.detail);
        const errorCode = event.detail ? event.detail.code : -1;
        let msg = 'Stream error, try another channel';
        if (errorCode === 4032) msg = 'DRM or license error - channel protected';
        else if (errorCode === 1001) msg = 'Network error';
        showToast(msg);
      });
      
      // Enable HLS.js fallback inside Shaka? Shaka natively supports HLS (TS/CMAF) and DASH.
      // Ensure that we also allow CORS and clear any custom filters.
      player.configure({
        drm: {
          clearKeys: {},
          servers: {},     // widevine etc can be added if needed
          retryParameters: { maxAttempts: 2 }
        },
        manifest: {
          dash: { ignoreMinBufferTime: false },
          hls: { ignoreTextStreamFailures: true }
        },
        streaming: {
          bufferingGoal: 30,
          rebufferingGoal: 15,
          retryParameters: { maxAttempts: 3 }
        }
      });
      return true;
    }
    
    // ----- LOAD CHANNEL with DRM / Headers support + fallback -----
    async function loadChannel(channel) {
      if (!player) return;
      toggleUI(false);
      audioBadge.style.display = 'none';
      loaderDiv.style.display = 'flex';
      
      let streamUrl = channel.url;
      if (!streamUrl) {
        loaderDiv.style.display = 'none';
        showToast(`No stream URL for ${channel.name}`);
        toggleUI(true);
        return;
      }
      
      try {
        // Reset networking filters to avoid duplicates
        if (player.getNetworkingEngine()) {
          player.getNetworkingEngine().clearAllRequestFilters();
        }
        
        // If custom headers exist, attach them (useful for some private streams)
        if (channel.headers && Object.keys(channel.headers).length) {
          player.getNetworkingEngine().registerRequestFilter((type, request) => {
            if (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || 
                type === shaka.net.NetworkingEngine.RequestType.SEGMENT) {
              for (const [key, value] of Object.entries(channel.headers)) {
                request.headers[key] = value;
              }
            }
          });
        }
        
        // DRM clearKeys configuration if present in channel metadata
        if (channel.drm && channel.drm.clearKeys && Object.keys(channel.drm.clearKeys).length) {
          player.configure({ drm: { clearKeys: channel.drm.clearKeys, servers: {} } });
        } else {
          // Reset clearKeys to default
          player.configure({ drm: { clearKeys: {} } });
        }
        
        // Attempt to load the stream (supports DASH manifest.mpd & HLS .m3u8)
        await player.load(streamUrl);
        
        // auto fullscreen for better experience after successful start
        if (container.requestFullscreen && !document.fullscreenElement) {
          try { await container.requestFullscreen(); } catch(e) { /* silent */ }
        }
      } catch (err) {
        console.error(`Failed to load ${channel.name}:`, err);
        let fallbackSuccess = false;
        if (channel.fallbackUrls && channel.fallbackUrls.length) {
          for (const altUrl of channel.fallbackUrls) {
            try {
              await player.load(altUrl);
              fallbackSuccess = true;
              break;
            } catch (fbErr) { console.warn(`Fallback failed: ${altUrl}`, fbErr); }
          }
        }
        if (!fallbackSuccess) {
          showToast(`"${channel.name}" offline or DRM blocked`);
          toggleUI(true);
        }
      } finally {
        loaderDiv.style.display = 'none';
      }
    }
    
    // ----- FETCH PH M3U (DASH + HLS mixed, full DRM-aware) -----
    async function fetchPhilippineChannels() {
      const m3uUrl = 'https://raw.githubusercontent.com/Harleythetech/IPHTV/refs/heads/main/ph.m3u';
      try {
        const resp = await fetch(m3uUrl);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.text();
        const lines = data.split(/\r?\n/);
        const channels = [];
        let current = null;
        
        for (let i = 0; i < lines.length; i++) {
          let line = lines[i].trim();
          if (line.startsWith('#EXTINF:')) {
            const nameMatch = line.match(/#EXTINF:-?\d*,\s*(.+)$/);
            let name = nameMatch ? nameMatch[1].trim() : 'Unknown';
            name = name.replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').trim();
            if (!name) name = 'Live Channel';
            current = {
              name: name,
              url: null,
              headers: null,
              drm: null,
              fallbackUrls: []
            };
          } else if (line && !line.startsWith('#') && current) {
            if (line.startsWith('http://') || line.startsWith('https://')) {
              current.url = line;
              // Detect if stream is DASH (manifest.mpd) or HLS (m3u8) — Shaka handles both seamlessly
              // Additional DRM detection: many ABS-CBN style DASH have no explicit keys but we keep configurable.
              // For special headers on some streams (like 'streams.comclark') keep optional
              if (line.includes('streams.comclark') || line.includes('amagi.tv')) {
                if (!current.headers) current.headers = {};
                // Some streams require user-agent for CORS, but we keep light.
                current.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)';
              }
              channels.push(current);
            }
            current = null;
          }
        }
        
        // Filter any entries without URL
        const valid = channels.filter(c => c && c.url);
        console.log(`[PH M3U] Loaded ${valid.length} channels (DASH/HLS)`);
        return valid;
      } catch (err) {
        console.error('M3U fetch error:', err);
        showToast('Could not fetch channel list from GitHub M3U', true);
        return [];
      }
    }
    
    // ----- RENDER GRID with ko-fi support card + M3U channels -----
    function renderChannels(channels) {
      grid.innerHTML = '';
      // Ko-fi support card
      const supportCard = document.createElement('div');
      supportCard.className = 'channel-card donate-card';
      supportCard.tabIndex = 0;
      supportCard.innerHTML = `<div class="logo-circle"><div class="letter-fallback">☕❤️</div></div><span>Support Creator</span>`;
      supportCard.onclick = () => window.open('https://ko-fi.com/acevin', '_blank');
      supportCard.onkeydown = (e) => e.key === 'Enter' && supportCard.onclick();
      grid.appendChild(supportCard);
      
      channels.forEach((ch, idx) => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.tabIndex = 0;
        card.setAttribute('data-name', ch.name.toLowerCase());
        const firstChar = ch.name.charAt(0).toUpperCase();
        card.innerHTML = `
          <div class="logo-circle">
            <div class="letter-fallback">${firstChar}</div>
          </div>
          <span>${escapeHtml(ch.name)}</span>
        `;
        card.onclick = async () => {
          lastFocusedCard = card;
          await loadChannel(ch);
        };
        card.onkeydown = (e) => {
          if (e.key === 'Enter') card.click();
        };
        grid.appendChild(card);
      });
      updateStats(channels.length);
    }
    
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    
    function updateStats(total) {
      const visibleCards = Array.from(grid.querySelectorAll('.channel-card:not(.filtered-out)')).filter(c => !c.classList.contains('donate-card'));
      const visibleCount = visibleCards.length;
      if (channelBadge) channelBadge.innerHTML = `📡 ${visibleCount}/${total} · DASH/HLS`;
    }
    
    function filterChannels(query) {
      const lower = query.toLowerCase().trim();
      const cards = Array.from(grid.querySelectorAll('.channel-card:not(.donate-card)'));
      cards.forEach(card => {
        const nameAttr = card.getAttribute('data-name') || '';
        if (lower === '' || nameAttr.includes(lower)) {
          card.classList.remove('filtered-out');
        } else {
          card.classList.add('filtered-out');
        }
      });
      const totalOrig = cards.length;
      const visible = cards.filter(c => !c.classList.contains('filtered-out')).length;
      if (channelBadge) channelBadge.innerHTML = `📺 ${visible}/${totalOrig} · PH Live`;
    }
    
    // ----- KEYBOARD NAVIGATION (grid + search) -----
    function setupNavigation() {
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (uiLayer.classList.contains('hidden')) {
            e.preventDefault();
            toggleUI(true);
          }
          return;
        }
        if (uiLayer.classList.contains('hidden')) return;
        
        const active = document.activeElement;
        const visibleCards = Array.from(grid.querySelectorAll('.channel-card:not(.filtered-out):not(.donate-card)'));
        
        if (active === searchBox && e.key === 'ArrowDown' && visibleCards.length) {
          e.preventDefault();
          visibleCards[0].focus();
        } 
        else if (active.classList && active.classList.contains('channel-card')) {
          const idx = visibleCards.indexOf(active);
          if (e.key === 'ArrowRight' && idx < visibleCards.length - 1) {
            e.preventDefault();
            visibleCards[idx+1].focus();
          } else if (e.key === 'ArrowLeft' && idx > 0) {
            e.preventDefault();
            visibleCards[idx-1].focus();
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            const below = visibleCards.filter(card => {
              const rectCard = card.getBoundingClientRect();
              const rectActive = active.getBoundingClientRect();
              return rectCard.top > rectActive.bottom + 2;
            });
            if (below.length) below[0].focus();
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            const above = visibleCards.filter(card => {
              const rectCard = card.getBoundingClientRect();
              const rectActive = active.getBoundingClientRect();
              return rectCard.bottom < rectActive.top - 2;
            });
            if (above.length) above[above.length-1].focus();
            else searchBox.focus();
          }
        }
      });
      
      searchBox.addEventListener('input', (e) => {
        filterChannels(e.target.value);
      });
    }
    
    // ----- clock updater -----
    function startClock() {
      const update = () => {
        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second:'2-digit' });
        document.getElementById('clock').innerText = timeString;
      };
      update();
      setInterval(update, 1000);
    }
    
    // helper to add fallback for specific channels that may have broken primary url (optional extra robustness)
    function enhanceChannelMetadata(channelList) {
      // For some DASH mpd links that might have temporary auth, we keep as-is.
      // But we can also assign a small fallback if same domain fails? not needed.
      // No extra modification to keep original URLs pure.
      return channelList;
    }
    
    // ----- MAIN BOOTSTRAP -----
    (async function bootstrap() {
      const playerInit = await initShakaPlayer();
      if (!playerInit) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; margin:2rem;">❌ Shaka Player failed to initialize. Try modern browser.</div>';
        return;
      }
      
      let m3uChannels = await fetchPhilippineChannels();
      if (!m3uChannels.length) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; margin:2rem;">⚠️ No channels loaded from M3U.<br>Check network or M3U source.</div>`;
        if (channelBadge) channelBadge.innerHTML = '⚠️ 0 streams';
      } else {
        m3uChannels = enhanceChannelMetadata(m3uChannels);
        allChannels = m3uChannels;
        renderChannels(allChannels);
        updateStats(allChannels.length);
      }
      
      toggleUI(true);
      setupNavigation();
      startClock();
      
      // Additional DRM note: some channels use Widevine, Shaka will request license if manifest indicates.
      // But given public M3U, most have no DRM, but we keep DRM module ready.
      // For future proof: if any channel requires license url, we could attach via drm.servers, but not in current M3U.
    })();
  })();
</script>
</body>
</html>
