<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PurePTV Web · ExoPlayer DRM Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0c12;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .player-wrapper {
            flex: 1;
            background: #000;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .channel-bar {
            background: #1a1e2a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .channel-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .channel-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        .channel-name {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .drm-badge {
            background: #7c3aed;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        .controls {
            display: flex;
            gap: 8px;
        }
        button {
            background: #2a2f3a;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }
        button.primary {
            background: #ff7b2c;
        }
        .channel-list {
            background: #0f111a;
            max-height: 250px;
            overflow-y: auto;
            border-top: 1px solid #2a2f3a;
        }
        .channel-item {
            padding: 12px 20px;
            border-bottom: 1px solid #1a1e2a;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .channel-item:hover {
            background: #1a1e2a;
        }
        .channel-item.active {
            background: #ff7b2c20;
            border-left: 3px solid #ff7b2c;
        }
        .stream-type {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            background: #2a2f3a;
        }
        .stream-type.dash { background: #7c3aed; }
        .stream-type.hls { background: #059669; }
        .loading {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a1e2a;
            padding: 8px 16px;
            border-radius: 30px;
            display: none;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #dc2626;
            padding: 8px 16px;
            border-radius: 30px;
            display: none;
        }
        .search-box {
            padding: 10px 20px;
            background: #0f111a;
            border-bottom: 1px solid #2a2f3a;
        }
        .search-box input {
            width: 100%;
            background: #1a1e2a;
            border: none;
            padding: 10px 16px;
            border-radius: 30px;
            color: white;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.compiled.js"></script>
</head>
<body>
<div class="player-wrapper">
    <video id="video" controls playsinline></video>
</div>
<div class="channel-bar">
    <div class="channel-info">
        <img class="channel-logo" id="channelLogo" style="display:none;">
        <span class="channel-name" id="channelName">Select a channel</span>
        <span class="drm-badge" id="drmBadge" style="display:none;">🔑 DRM</span>
    </div>
    <div class="controls">
        <button id="prevBtn">◀ Prev</button>
        <button id="nextBtn" class="primary">Next ▶</button>
    </div>
</div>
<div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Search channels...">
</div>
<div class="channel-list" id="channelList"></div>
<div class="loading" id="loading">⏳ Loading stream...</div>
<div class="toast" id="toast"></div>

<script>
    let player = null;
    let channels = [];
    let currentIndex = 0;
    let currentChannel = null;

    // Convert HEX to Base64 (tulad sa ExoPlayer code)
    function hexToBase64(hex) {
        if (!hex) return null;
        // Remove spaces and ensure even length
        hex = hex.replace(/\s/g, '');
        if (hex.length % 2 !== 0) hex = '0' + hex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length; i += 2) {
            bytes[i/2] = parseInt(hex.substr(i, 2), 16);
        }
        return btoa(String.fromCharCode.apply(null, bytes));
    }

    // Build ClearKey license JSON (EXACT same as ExoPlayer)
    function buildClearKeyLicense(keyIdHex, keyValueHex) {
        const kidBase64 = hexToBase64(keyIdHex);
        const keyBase64 = hexToBase64(keyValueHex);
        
        const license = {
            keys: [{
                kty: "oct",
                kid: kidBase64,
                k: keyBase64
            }],
            type: "temporary"
        };
        return new TextEncoder().encode(JSON.stringify(license));
    }

    // Detect stream type
    function detectStreamType(url) {
        if (!url) return 'unknown';
        const u = url.toLowerCase();
        if (u.includes('.m3u8') || u.includes('/hls/')) return 'hls';
        if (u.includes('.mpd') || u.includes('/dash/') || u.includes('manifest.mpd')) return 'dash';
        return 'http';
    }

    // Extract KID and KEY from M3U line or URL
    // Sa PH M3U, ang mga key ay nasa #EXT-X-KEY or kung minsan embedded sa AuthInfo
    function extractDRMFromLine(line, url) {
        // Pattern: #EXT-X-KEY:METHOD=CLEARKEY,URI="data:text/plain;charset=UTF-16;base64,XXXX"
        const clearkeyMatch = line.match(/CLEARKEY.*URI="data:.*base64,([^"]+)"/i);
        if (clearkeyMatch) {
            try {
                const decoded = atob(clearkeyMatch[1]);
                const json = JSON.parse(decoded);
                if (json.keys && json.keys[0]) {
                    return {
                        kid: json.keys[0].kid,
                        key: json.keys[0].k
                    };
                }
            } catch(e) {}
        }
        
        // Check for custom tags: #EXT-X-KID:XXXX #EXT-X-KEY:XXXX
        const kidMatch = line.match(/#EXT-X-KID[:\s]+([A-Fa-f0-9]+)/i);
        const keyMatch = line.match(/#EXT-X-KEY[:\s]+([A-Fa-f0-9]+)/i);
        if (kidMatch && keyMatch) {
            return { kid: kidMatch[1], key: keyMatch[1] };
        }
        
        return null;
    }

    // Initialize Shaka with DRM support
    async function initShaka() {
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
            showToast('Browser not supported');
            return false;
        }
        
        player = new shaka.Player(document.getElementById('video'));
        
        // Configure for ClearKey DRM
        player.configure({
            drm: {
                clearKeys: {},
                retryParameters: { maxAttempts: 3 }
            },
            streaming: {
                bufferingGoal: 30,
                retryParameters: { maxAttempts: 4 }
            },
            manifest: {
                dash: { ignoreMinBufferTime: false },
                hls: { ignoreTextStreamFailures: true }
            }
        });
        
        player.addEventListener('error', (e) => {
            console.error('Shaka error', e.detail);
            let msg = 'Stream error';
            if (e.detail.code === 4032) msg = 'DRM error - ClearKey failed';
            else if (e.detail.code === 1001) msg = 'Network timeout';
            showToast(msg);
            hideLoading();
        });
        
        return true;
    }

    // Load channel with DRM if available
    async function loadChannel(channel, index) {
        if (!player) return;
        
        currentChannel = channel;
        currentIndex = index;
        
        showLoading();
        updateUI(channel);
        
        // Update active state in list
        document.querySelectorAll('.channel-item').forEach((el, i) => {
            if (i === index) el.classList.add('active');
            else el.classList.remove('active');
        });
        
        const url = channel.url;
        const streamType = detectStreamType(url);
        
        try {
            // Reset networking filters
            if (player.getNetworkingEngine()) {
                player.getNetworkingEngine().clearAllRequestFilters();
            }
            
            // Add custom headers (tulad sa ExoPlayer)
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                request.headers['User-Agent'] = 'NeroIPTV/1.0 (Android; ExoPlayer)';
                request.headers['Origin'] = window.location.origin;
            });
            
            // Apply DRM kung meron
            if (channel.hasDrm && channel.clearKeyId && channel.clearKeyValue) {
                const clearKeys = {};
                // ExoPlayer uses HEX directly, convert to base64 for Shaka
                const kidBase64 = hexToBase64(channel.clearKeyId);
                const keyBase64 = hexToBase64(channel.clearKeyValue);
                clearKeys[kidBase64] = keyBase64;
                player.configure({ drm: { clearKeys: clearKeys } });
                console.log('Applied ClearKey DRM:', channel.clearKeyId);
                document.getElementById('drmBadge').style.display = 'inline-block';
            } else {
                player.configure({ drm: { clearKeys: {} } });
                document.getElementById('drmBadge').style.display = 'none';
            }
            
            await player.load(url);
            await document.getElementById('video').play();
            
        } catch (err) {
            console.error('Load failed:', err);
            showToast(`Cannot play: ${channel.name}`);
        } finally {
            hideLoading();
        }
    }
    
    function updateUI(channel) {
        document.getElementById('channelName').textContent = channel.name;
        const logo = document.getElementById('channelLogo');
        if (channel.logoUrl) {
            logo.src = channel.logoUrl;
            logo.style.display = 'inline-block';
        } else {
            logo.style.display = 'none';
        }
    }
    
    function showLoading() {
        document.getElementById('loading').style.display = 'flex';
    }
    
    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
    }
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }
    
    // Fetch and parse M3U with DRM detection
    async function fetchChannels() {
        const m3uUrl = 'https://raw.githubusercontent.com/Harleythetech/IPHTV/refs/heads/main/ph.m3u';
        try {
            const resp = await fetch(m3uUrl);
            if (!resp.ok) throw new Error('M3U fetch failed');
            const text = await resp.text();
            const lines = text.split(/\r?\n/);
            const channelList = [];
            let currentChannel = null;
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    const match = line.match(/#EXTINF:-?\d*,\s*(.+)$/);
                    let name = match ? match[1].trim() : 'Unknown';
                    name = name.replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').trim();
                    
                    currentChannel = {
                        name: name,
                        url: null,
                        logoUrl: null,
                        hasDrm: false,
                        clearKeyId: null,
                        clearKeyValue: null
                    };
                    
                    // Check for logo in EXTINF
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    if (logoMatch) currentChannel.logoUrl = logoMatch[1];
                    
                    // Check for DRM in EXTINF line
                    const drmInfo = extractDRMFromLine(line);
                    if (drmInfo) {
                        currentChannel.hasDrm = true;
                        currentChannel.clearKeyId = drmInfo.kid;
                        currentChannel.clearKeyValue = drmInfo.key;
                    }
                    
                } else if (line && !line.startsWith('#') && currentChannel) {
                    if (line.startsWith('http://') || line.startsWith('https://')) {
                        currentChannel.url = line;
                        
                        // Check URL for DRM hints
                        if (line.includes('AuthInfo') || line.includes('DRM')) {
                            currentChannel.hasDrm = true;
                            // Some streams embed key in URL parameters
                            const kidMatch = line.match(/[?&]kid=([^&]+)/i);
                            const keyMatch = line.match(/[?&]key=([^&]+)/i);
                            if (kidMatch && keyMatch) {
                                currentChannel.clearKeyId = kidMatch[1];
                                currentChannel.clearKeyValue = keyMatch[1];
                            }
                        }
                        
                        channelList.push(currentChannel);
                    }
                    currentChannel = null;
                }
            }
            
            console.log(`Loaded ${channelList.length} channels`);
            return channelList;
            
        } catch (err) {
            console.error(err);
            showToast('Failed to load channel list');
            return [];
        }
    }
    
    function renderChannelList() {
        const container = document.getElementById('channelList');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        
        let filtered = channels;
        if (searchTerm) {
            filtered = channels.filter(ch => ch.name.toLowerCase().includes(searchTerm));
        }
        
        if (filtered.length === 0) {
            container.innerHTML = '<div style="padding: 20px; text-align: center; color: #6b7280;">No channels found</div>';
            return;
        }
        
        container.innerHTML = filtered.map((ch, idx) => {
            const type = detectStreamType(ch.url);
            const typeClass = type === 'dash' ? 'dash' : (type === 'hls' ? 'hls' : '');
            const drmMark = ch.hasDrm ? '🔑 ' : '';
            return `
                <div class="channel-item" data-index="${channels.indexOf(ch)}">
                    <span class="channel-name">${drmMark}${escapeHtml(ch.name)}</span>
                    <span class="stream-type ${typeClass}">${type.toUpperCase()}</span>
                </div>
            `;
        }).join('');
        
        document.querySelectorAll('.channel-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.index);
                const channel = channels[idx];
                loadChannel(channel, idx);
            });
        });
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Navigation
    function prevChannel() {
        if (channels.length === 0) return;
        let newIndex = currentIndex - 1;
        if (newIndex < 0) newIndex = channels.length - 1;
        loadChannel(channels[newIndex], newIndex);
    }
    
    function nextChannel() {
        if (channels.length === 0) return;
        let newIndex = currentIndex + 1;
        if (newIndex >= channels.length) newIndex = 0;
        loadChannel(channels[newIndex], newIndex);
    }
    
    // Initialize
    async function init() {
        const ok = await initShaka();
        if (!ok) return;
        
        channels = await fetchChannels();
        renderChannelList();
        
        // Setup event listeners
        document.getElementById('prevBtn').addEventListener('click', prevChannel);
        document.getElementById('nextBtn').addEventListener('click', nextChannel);
        document.getElementById('searchInput').addEventListener('input', renderChannelList);
        
        if (channels.length > 0) {
            loadChannel(channels[0], 0);
        }
    }
    
    init();
</script>
</body>
</html>
