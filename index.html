<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TVPASS PH · M3U Powered IPTV</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0c12;
      --bg-card: #1a1e2a;
      --accent: #ff7b2c;
      --accent-glow: rgba(255, 123, 44, 0.3);
      --text: #eef2ff;
      --text-dim: #9ca3af;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Player Modal */
    .player-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.2s, opacity 0.2s;
    }

    .player-modal.active {
      visibility: visible;
      opacity: 1;
    }

    .player-modal-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
    }

    .player-panel {
      position: relative;
      width: 90%;
      max-width: 1200px;
      background: var(--bg-card);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .player-stage {
      position: relative;
      background: #000;
      min-height: 400px;
    }

    #video {
      width: 100%;
      height: auto;
      max-height: 70vh;
      display: block;
    }

    .player-loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-loading.hidden {
      display: none;
    }

    .player-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--text-dim);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .player-body {
      padding: 20px;
    }

    .player-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }

    .player-title-wrap .eyebrow {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
    }

    .player-title-wrap h2 {
      font-size: 1.5rem;
      margin: 8px 0;
    }

    .status-chip.live {
      background: #dc2626;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .player-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .button {
      background: var(--accent);
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .ghost-button {
      background: transparent;
      border: 1px solid var(--text-dim);
      padding: 10px 24px;
      border-radius: 40px;
      color: var(--text);
      cursor: pointer;
    }

    .player-header-control {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      color: var(--text);
      cursor: pointer;
    }

    /* Layout */
    .shell {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #ffb347);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px 0;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .pill {
      background: var(--bg-card);
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      color: var(--text);
      cursor: pointer;
    }

    .pill.active {
      background: var(--accent);
      color: white;
    }

    .search-input {
      background: var(--bg-card);
      border: 1px solid #2a2f3a;
      padding: 10px 20px;
      border-radius: 40px;
      color: var(--text);
      width: 250px;
    }

    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }

    .channel-card {
      background: var(--bg-card);
      padding: 16px;
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .channel-card:hover {
      transform: translateY(-4px);
      background: #252a38;
    }

    .channel-card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 10px;
      border-radius: 12px;
    }

    .channel-card .placeholder {
      width: 60px;
      height: 60px;
      background: #2a2f3a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .channel-card span {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-dim);
    }

    .hidden {
      display: none;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #dc2626;
      color: white;
      padding: 10px 20px;
      border-radius: 40px;
      z-index: 1100;
      display: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.compiled.js"></script>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">TV</span>
      <div>
        <div><strong>TVPASS PH</strong></div>
        <div style="font-size: 0.7rem; color: var(--text-dim);">M3U Powered · DASH/HLS</div>
      </div>
    </div>
    <div class="eyebrow">LIVE TV</div>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <div class="chips" id="categoryChips">
        <button class="pill active" data-cat="all">All</button>
      </div>
    </div>
    <div class="toolbar-right">
      <input type="search" class="search-input" id="searchInput" placeholder="Search channels...">
    </div>
  </div>

  <div class="channel-grid" id="channelGrid"></div>
  <div class="empty-state hidden" id="emptyState">No channels found</div>
</div>

<!-- Player Modal -->
<div class="player-modal" id="playerModal">
  <div class="player-modal-backdrop" id="playerModalBackdrop"></div>
  <div class="player-panel">
    <div class="player-stage">
      <video id="video" controls playsinline></video>
      <div class="player-loading hidden" id="playerLoading">
        <div class="player-spinner"></div>
      </div>
    </div>
    <div class="player-body">
      <div class="player-head">
        <div class="player-title-wrap">
          <div class="eyebrow">Now Playing</div>
          <h2 id="playerTitle">Select a channel</h2>
        </div>
        <div class="player-head-actions">
          <span class="status-chip live">LIVE</span>
          <button class="player-header-control" id="playerModalClose">✕ Close</button>
        </div>
      </div>
      <p class="player-description" id="playerDescription">Click any channel from the list to start streaming.</p>
      <div class="player-actions">
        <button class="ghost-button" id="playerModalCloseBtn">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">⚠️ Stream error</div>

<script>
  let player = null;
  let allChannels = [];
  let currentCategory = 'all';
  let currentSearch = '';

  // DOM elements
  const video = document.getElementById('video');
  const modal = document.getElementById('playerModal');
  const grid = document.getElementById('channelGrid');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');
  const categoryChips = document.getElementById('categoryChips');
  const playerTitle = document.getElementById('playerTitle');
  const playerDescription = document.getElementById('playerDescription');
  const playerLoading = document.getElementById('playerLoading');
  const toast = document.getElementById('toast');

  function showToast(msg) {
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
  }

  // Initialize Shaka Player
  async function initPlayer() {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) {
      showToast('Browser not supported');
      return false;
    }
    player = new shaka.Player(video);
    player.configure({
      drm: { clearKeys: {}, servers: {} },
      streaming: { bufferingGoal: 30, retryParameters: { maxAttempts: 3 } }
    });
    player.addEventListener('error', (e) => {
      console.error('Shaka error', e.detail);
      showToast('Playback error - channel may be offline');
      playerLoading.classList.add('hidden');
    });
    return true;
  }

  // Load channel with full URL (keeps AuthInfo intact)
  async function loadChannel(channel) {
    if (!player) return;
    
    modal.classList.add('active');
    playerTitle.textContent = channel.name;
    playerDescription.textContent = channel.description || 'Live stream';
    playerLoading.classList.remove('hidden');
    
    try {
      // Reset networking filters
      if (player.getNetworkingEngine()) {
        player.getNetworkingEngine().clearAllRequestFilters();
      }
      
      // Add headers to mimic browser
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36';
        request.headers['Origin'] = window.location.origin;
      });
      
      await player.load(channel.url);
    } catch (err) {
      console.error('Load failed:', err);
      showToast(`Cannot play ${channel.name}`);
    } finally {
      playerLoading.classList.add('hidden');
    }
  }

  // Fetch PH M3U channels
  async function fetchM3UChannels() {
    const m3uUrl = 'https://raw.githubusercontent.com/Harleythetech/IPHTV/refs/heads/main/ph.m3u';
    try {
      const res = await fetch(m3uUrl);
      if (!res.ok) throw new Error('M3U fetch failed');
      const text = await res.text();
      const lines = text.split(/\r?\n/);
      const channels = [];
      let current = null;
      
      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
          const match = line.match(/#EXTINF:-?\d*,\s*(.+)$/);
          let name = match ? match[1].trim() : 'Unknown';
          name = name.replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').trim();
          current = { name: name, url: null, description: 'Live stream' };
        } else if (line && !line.startsWith('#') && current) {
          if (line.startsWith('http://') || line.startsWith('https://')) {
            current.url = line;
            channels.push(current);
          }
          current = null;
        }
      }
      return channels;
    } catch (err) {
      console.error(err);
      showToast('Failed to load channel list');
      return [];
    }
  }

  // Get unique categories from channels (based on name keywords)
  function detectCategory(channelName) {
    const name = channelName.toLowerCase();
    if (name.includes('news') || name.includes('bbc') || name.includes('cnn') || name.includes('cgtn')) return 'News';
    if (name.includes('sports') || name.includes('nba') || name.includes('uaap') || name.includes('pba')) return 'Sports';
    if (name.includes('movie') || name.includes('cinema') || name.includes('hbo') || name.includes('cinemax')) return 'Movies';
    if (name.includes('kids') || name.includes('cartoon') || name.includes('nick') || name.includes('disney')) return 'Kids';
    if (name.includes('lifestyle') || name.includes('food') || name.includes('travel') || name.includes('fashion')) return 'Lifestyle';
    if (name.includes('gma') || name.includes('tv5') || name.includes('abs') || name.includes('kapamilya') || name.includes('a2z')) return 'Local';
    return 'Entertainment';
  }

  function renderCategories(channels) {
    const cats = new Set(['all']);
    channels.forEach(ch => {
      cats.add(detectCategory(ch.name));
    });
    categoryChips.innerHTML = Array.from(cats).map(cat => 
      `<button class="pill ${currentCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</button>`
    ).join('');
    
    document.querySelectorAll('[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.cat;
        renderFilteredChannels();
      });
    });
  }

  function renderFilteredChannels() {
    let filtered = allChannels;
    
    if (currentCategory !== 'all') {
      filtered = filtered.filter(ch => detectCategory(ch.name) === currentCategory);
    }
    
    if (currentSearch) {
      filtered = filtered.filter(ch => ch.name.toLowerCase().includes(currentSearch));
    }
    
    renderGrid(filtered);
  }

  function renderGrid(channels) {
    if (channels.length === 0) {
      grid.innerHTML = '';
      emptyState.classList.remove('hidden');
      return;
    }
    emptyState.classList.add('hidden');
    
    grid.innerHTML = channels.map(ch => `
      <div class="channel-card" data-url="${escapeHtml(ch.url)}" data-name="${escapeHtml(ch.name)}">
        <div class="placeholder">${ch.name.charAt(0).toUpperCase()}</div>
        <span>${escapeHtml(ch.name)}</span>
      </div>
    `).join('');
    
    document.querySelectorAll('.channel-card').forEach(card => {
      card.addEventListener('click', () => {
        const url = card.dataset.url;
        const name = card.dataset.name;
        loadChannel({ url, name, description: 'Live stream from M3U' });
      });
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Event listeners
  function closeModal() {
    modal.classList.remove('active');
    if (player) player.unload();
  }

  document.getElementById('playerModalClose').addEventListener('click', closeModal);
  document.getElementById('playerModalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('playerModalBackdrop').addEventListener('click', closeModal);
  
  searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value.toLowerCase();
    renderFilteredChannels();
  });

  // Initialize
  async function init() {
    await initPlayer();
    allChannels = await fetchM3UChannels();
    if (allChannels.length === 0) {
      grid.innerHTML = '<div style="text-align:center; padding:40px;">⚠️ No channels loaded. Check M3U source.</div>';
    } else {
      renderCategories(allChannels);
      renderFilteredChannels();
    }
  }
  
  init();
</script>
</body>
</html>
